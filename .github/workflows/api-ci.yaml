name: API CI

on:
  push:
    paths:
      - '.github/workflows/api-ci.yaml'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - 'apps/api/**'
  pull_request:
    paths:
      - '.github/workflows/api-ci.yaml'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - 'apps/api/**'

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies (workspaces)
        run: npm ci
        working-directory: .

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build