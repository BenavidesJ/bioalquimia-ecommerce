services:
  api:
    build:
      context: .
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: bioalquimia
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SYNC: "false"
    ports:
      - 3000:3000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: bioalquimia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - 5432:5432
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "bioalquimia"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data: